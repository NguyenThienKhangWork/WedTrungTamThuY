services:
  # 1. Ứng dụng Web PawNest & CozyPaws (PHP 8.2 + Apache)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pawnest_web
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: pawnest_db
      DB_USER: pawnest_user
      DB_PASS: pawnest_pass
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  # 2. Cơ sở dữ liệu MySQL 8.0 (Tự động khởi tạo schema.sql & seed.sql)
  db:
    image: mysql:8.0
    container_name: pawnest_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: pawnest_db
      MYSQL_USER: pawnest_user
      MYSQL_PASSWORD: pawnest_pass
    ports:
      - "3306:3306"
    volumes:
      - pawnest_mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "pawnest_user", "-ppawnest_pass" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # 3. phpMyAdmin - Giao diện quản trị cơ sở dữ liệu web trực quan (Cổng 8081)
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: pawnest_phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: pawnest_user
      PMA_PASSWORD: pawnest_pass
    depends_on:
      - db

volumes:
  pawnest_mysql_data:
    driver: local
